<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1830;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#211d3d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a2550;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5B5BD6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Decorative indigo glows -->
  <circle cx="100" cy="100" r="200" fill="#5B5BD6" opacity="0.06" />
  <circle cx="1100" cy="530" r="250" fill="#5B5BD6" opacity="0.06" />
  <circle cx="900" cy="80" r="150" fill="#818cf8" opacity="0.05" />

  <!-- Subtle grid lines -->
  <line x1="60" y1="520" x2="1140" y2="520" stroke="#ffffff" stroke-width="0.5" opacity="0.08" />
  <line x1="60" y1="110" x2="1140" y2="110" stroke="#ffffff" stroke-width="0.5" opacity="0.08" />

  <!-- App icon / Logo area -->
  <rect x="80" y="160" width="80" height="80" rx="16" fill="url(#accent)" />
  <text x="120" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="#ffffff" text-anchor="middle">P</text>

  <!-- App Name -->
  <text x="190" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="700" fill="#ffffff" text-anchor="start">Pakamon</text>

  <!-- Hebrew Name -->
  <text x="480" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="400" fill="#a5b4fc" text-anchor="start" opacity="0.95">&#x05E4;&#x05DB;&#x05DE;&#x05D5;&#x05DF;</text>

  <!-- Tagline (right-anchored so the RTL line stays on canvas) -->
  <text x="1120" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#ffffff" opacity="0.85" text-anchor="end">
    &#x05EA;&#x05DB;&#x05E0;&#x05D5;&#x05DF; &#x05D0;&#x05E7;&#x05D3;&#x05DE;&#x05D9; &#x05D7;&#x05DB;&#x05DD; &#x05DC;&#x05EA;&#x05D5;&#x05D0;&#x05E8; &#x05E4;&#x05D9;&#x05DC;&#x05D5;&#x05E1;&#x05D5;&#x05E4;&#x05D9;&#x05D4;, &#x05DB;&#x05DC;&#x05DB;&#x05DC;&#x05D4; &#x05D5;&#x05DE;&#x05D3;&#x05E2; &#x05D4;&#x05DE;&#x05D3;&#x05D9;&#x05E0;&#x05D4;
  </text>

  <!-- Feature pills -->
  <rect x="80" y="360" width="200" height="44" rx="22" fill="#ffffff" opacity="0.1" />
  <text x="180" y="388" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" opacity="0.9">&#x05EA;&#x05DB;&#x05E0;&#x05D5;&#x05DF; &#x05EA;&#x05D5;&#x05D0;&#x05E8;</text>

  <rect x="300" y="360" width="220" height="44" rx="22" fill="#ffffff" opacity="0.1" />
  <text x="410" y="388" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" opacity="0.9">&#x05DC;&#x05D5;&#x05D7; &#x05D6;&#x05DE;&#x05E0;&#x05D9;&#x05DD; &#x05D7;&#x05DB;&#x05DD;</text>

  <rect x="540" y="360" width="240" height="44" rx="22" fill="#ffffff" opacity="0.1" />
  <text x="660" y="388" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" opacity="0.9">&#x05E2;&#x05D5;&#x05D6;&#x05E8; AI &#x05D7;&#x05D9;&#x05E0;&#x05DD;&#x05D9;</text>

  <!-- Discipline accents (on-brand indigo shades) -->
  <rect x="80" y="450" width="160" height="4" rx="2" fill="#818cf8" opacity="0.85" />
  <rect x="250" y="450" width="160" height="4" rx="2" fill="#5B5BD6" opacity="0.85" />
  <rect x="420" y="450" width="160" height="4" rx="2" fill="#4F4FC9" opacity="0.85" />

  <text x="160" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#a5b4fc" text-anchor="middle" opacity="0.85">&#x05E4;&#x05D9;&#x05DC;&#x05D5;&#x05E1;&#x05D5;&#x05E4;&#x05D9;&#x05D4;</text>
  <text x="330" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#a5b4fc" text-anchor="middle" opacity="0.85">&#x05DB;&#x05DC;&#x05DB;&#x05DC;&#x05D4;</text>
  <text x="500" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#a5b4fc" text-anchor="middle" opacity="0.85">&#x05DE;&#x05D3;&#x05E2; &#x05D4;&#x05DE;&#x05D3;&#x05D9;&#x05E0;&#x05D4;</text>

  <!-- University badge -->
  <text x="1120" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#ffffff" text-anchor="end" opacity="0.4">Tel Aviv University | &#x05D0;&#x05D5;&#x05E0;&#x05D9;&#x05D1;&#x05E8;&#x05E1;&#x05D9;&#x05D8;&#x05EA; &#x05EA;&#x05DC; &#x05D0;&#x05D1;&#x05D9;&#x05D1;</text>
</svg>
