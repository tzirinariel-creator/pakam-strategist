<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Assistant','Heebo','Segoe UI',system-ui,-apple-system,sans-serif">
  <!--
    כרטיס הקישור של פכמון — מה שסטודנט רואה כשהקישור נשלח בוואטסאפ.

    אריאל, 5.9: "תוכל לעשות רקע יפה יותר... משהו שיותר משקף את העיצוב
    של האפליקציה ולא כזה מוזר?"

    הגרסה הקודמת הייתה כרטיס SaaS גנרי: רקע כהה בזמן שהאפליקציה בהירה,
    ריבוע עם האות P, ושלושה צ'יפים שאחד מהם — "חינם AI עוזר" — הוא בדיוק
    העברית השבורה שאריאל נלחם בה, וגם סותר את הכלל שאוסר מיתוג AI גנרי.

    כאן: הצבעים האמיתיים של האפליקציה (#FCFCFD רקע, #5B5BD6 מבטא,
    וצבעי שלושת החוגים מ-tau-ppe-2025.ts), הכתר של המלך הפילוסוף במקום
    האות, ומיניאטורה של גיליון הבידינג — כי זיהוי החפיפות הוא מה
    שמבדיל אותנו, ואי-אפשר להראות אותו בצ'יפ.
  -->
  <defs>
    <radialGradient id="wash" cx="88%" cy="12%" r="70%">
      <stop offset="0%" stop-color="#5B5BD6" stop-opacity="0.13"/>
      <stop offset="55%" stop-color="#5B5BD6" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#5B5BD6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wash2" cx="10%" cy="95%" r="55%">
      <stop offset="0%" stop-color="#4A90D9" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#4A90D9" stop-opacity="0"/>
    </radialGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#18181B" flood-opacity="0.10"/>
    </filter>
    <filter id="chip" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#18181B" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#FCFCFD"/>
  <rect width="1200" height="630" fill="url(#wash)"/>
  <rect width="1200" height="630" fill="url(#wash2)"/>

  <!-- ── הצד הימני: המותג והמסר (RTL) ───────────────────────── -->

  <!-- תג הכתר — סמל המלך הפילוסוף, לא אות בריבוע -->
  <rect x="1032" y="72" width="76" height="76" rx="22" fill="#5B5BD6"/>
  <g transform="translate(1046,86) scale(2.0)">
    <path d="M3.4 18.2 L4.7 9.6 L8.9 13.1 L12 6.9 L15.1 13.1 L19.3 9.6 L20.6 18.2 Z"
          fill="#ffffff" fill-opacity="0.96"/>
    <circle cx="12" cy="5.4" r="1.5" fill="#ffffff"/>
    <circle cx="4.7" cy="8.2" r="1.05" fill="#ffffff" fill-opacity="0.85"/>
    <circle cx="19.3" cy="8.2" r="1.05" fill="#ffffff" fill-opacity="0.85"/>
  </g>

  <text x="1006" y="126" text-anchor="end" font-size="44" font-weight="800" fill="#18181B">פכמון</text>

  <!-- הכותרת — אותו משפט שעל דף הנחיתה -->
  <text x="1108" y="248" text-anchor="end" font-size="76" font-weight="800" fill="#18181B" letter-spacing="-1.5">שלושה חוגים,</text>
  <text x="1108" y="336" text-anchor="end" font-size="76" font-weight="800" fill="#18181B" letter-spacing="-1.5">לוח אחד.</text>

  <text x="1108" y="402" text-anchor="end" font-size="29" font-weight="500" fill="#52525B">גיליון בידינג שמראה איפה יש חפיפה,</text>
  <text x="1108" y="442" text-anchor="end" font-size="29" font-weight="500" fill="#52525B">לפני שאתם מגישים.</text>

  <!-- פס שלושת החוגים, בצבעים האמיתיים מהקטלוג -->
  <g>
    <rect x="1018" y="500" width="90" height="5" rx="2.5" fill="#4A90D9"/>
    <text x="1108" y="536" text-anchor="end" font-size="20" font-weight="600" fill="#3F3F46">פילוסופיה</text>
    <rect x="934" y="500" width="60" height="5" rx="2.5" fill="#2ECC71"/>
    <text x="994" y="536" text-anchor="end" font-size="20" font-weight="600" fill="#3F3F46">כלכלה</text>
    <rect x="795" y="500" width="115" height="5" rx="2.5" fill="#E74C3C"/>
    <text x="910" y="536" text-anchor="end" font-size="20" font-weight="600" fill="#3F3F46">מדע המדינה</text>
  </g>

  <text x="1108" y="586" text-anchor="end" font-size="19" font-weight="500" fill="#8A8A93">חינם · אוניברסיטת תל אביב</text>

  <!-- ── הצד השמאלי: המוצר עצמו ──────────────────────────────── -->
  <g filter="url(#lift)">
    <rect x="72" y="96" width="560" height="438" rx="24" fill="#FFFFFF" stroke="#E8E8EC" stroke-width="1"/>
  </g>

  <!-- כותרת הכרטיס -->
  <text x="600" y="146" text-anchor="end" font-size="23" font-weight="700" fill="#18181B">תכנון התואר</text>
  <text x="600" y="176" text-anchor="end" font-size="17" font-weight="500" fill="#8A8A93">גררו קורסים בין סמסטרים</text>
  <rect x="104" y="128" width="86" height="30" rx="15" fill="#5B5BD6" fill-opacity="0.10"/>
  <text x="147" y="149" text-anchor="middle" font-size="16" font-weight="700" fill="#5B5BD6">14/27</text>

  <line x1="104" y1="200" x2="600" y2="200" stroke="#E8E8EC" stroke-width="1"/>

  <!-- שתי עמודות הסמסטרים -->
  <text x="600" y="234" text-anchor="end" font-size="18" font-weight="700" fill="#3F3F46">סמסטר א׳</text>
  <text x="352" y="234" text-anchor="end" font-size="18" font-weight="700" fill="#3F3F46">סמסטר ב׳</text>

  <!-- סמסטר א׳ -->
  <g filter="url(#chip)">
    <rect x="372" y="250" width="228" height="52" rx="11" fill="#FFFFFF" stroke="#E8E8EC"/>
    <rect x="594" y="250" width="6" height="52" rx="3" fill="#2ECC71"/>
    <rect x="372" y="312" width="228" height="52" rx="11" fill="#FFFFFF" stroke="#E8E8EC"/>
    <rect x="594" y="312" width="6" height="52" rx="3" fill="#4A90D9"/>
    <rect x="372" y="374" width="228" height="52" rx="11" fill="#FFFFFF" stroke="#E8E8EC"/>
    <rect x="594" y="374" width="6" height="52" rx="3" fill="#E74C3C"/>
  </g>
  <text x="580" y="272" text-anchor="end" font-size="16" font-weight="600" fill="#27272A">מיקרו כלכלה א׳</text>
  <text x="580" y="292" text-anchor="end" font-size="13" fill="#8A8A93">5 ש״ס · חובה</text>
  <text x="580" y="334" text-anchor="end" font-size="16" font-weight="600" fill="#27272A">מבוא ללוגיקה</text>
  <text x="580" y="354" text-anchor="end" font-size="13" fill="#8A8A93">4 ש״ס · חובה</text>
  <text x="580" y="396" text-anchor="end" font-size="16" font-weight="600" fill="#27272A">פוליטיקה ומשטר</text>
  <text x="580" y="416" text-anchor="end" font-size="13" fill="#8A8A93">4 ש״ס · חובה</text>

  <!-- סמסטר ב׳ -->
  <g filter="url(#chip)">
    <rect x="124" y="250" width="228" height="52" rx="11" fill="#FFFFFF" stroke="#E8E8EC"/>
    <rect x="346" y="250" width="6" height="52" rx="3" fill="#4A90D9"/>
    <rect x="124" y="312" width="228" height="52" rx="11" fill="#FFFFFF" stroke="#E8E8EC"/>
    <rect x="346" y="312" width="6" height="52" rx="3" fill="#2ECC71"/>
  </g>
  <text x="332" y="272" text-anchor="end" font-size="16" font-weight="600" fill="#27272A">פילוסופיה של המדע</text>
  <text x="332" y="292" text-anchor="end" font-size="13" fill="#8A8A93">4 ש״ס</text>
  <text x="332" y="334" text-anchor="end" font-size="16" font-weight="600" fill="#27272A">מאקרו כלכלה</text>
  <text x="332" y="354" text-anchor="end" font-size="13" fill="#8A8A93">6 ש״ס</text>

  <!-- שטח הגרירה הריק -->
  <rect x="124" y="374" width="228" height="52" rx="11" fill="none" stroke="#E8E8EC" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="238" y="406" text-anchor="middle" font-size="14" fill="#A1A1AA">גררו לכאן</text>

  <!-- ההתרעה על החפיפה — הדבר שמבדיל אותנו -->
  <rect x="104" y="446" width="496" height="62" rx="13" fill="#E74C3C" fill-opacity="0.08" stroke="#E74C3C" stroke-opacity="0.16"/>
  <circle cx="572" cy="477" r="13" fill="#E74C3C" fill-opacity="0.18"/>
  <text x="572" y="483" text-anchor="middle" font-size="16" font-weight="800" fill="#C0392B">!</text>
  <text x="544" y="471" text-anchor="end" font-size="16" font-weight="700" fill="#C0392B">חפיפה ביום ראשון</text>
  <text x="544" y="495" text-anchor="end" font-size="14" fill="#9C3A2E" direction="ltr">10:00–12:00</text>
</svg>
