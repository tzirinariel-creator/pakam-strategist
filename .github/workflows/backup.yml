# =============================================================================
# Free scheduled DB backup (no paid Supabase plan needed).
#
# DORMANT until the owner adds a repository secret — DIRECT_URL (preferred, a
# non-pooled connection) or DATABASE_URL — in Settings → Secrets and variables
# → Actions. Until then the job runs, sees no secret, prints a notice, exits 0.
#
# Once active it dumps the DB daily with an exact-version pg_dump (run via the
# official postgres:17 image, since GitHub runners have Docker and pg17 can dump
# any server <= 17 — Supabase runs 15/17), and stores it as a PRIVATE workflow
# artifact (downloadable only by people with repo access, kept 30 days).
# NOTE for the owner: the artifact contains real student data. Artifacts are
# private to the repo; if you prefer another destination (a private backup repo
# or external object storage) say so and it can be repointed.
# =============================================================================
name: DB Backup (free)

on:
  schedule:
    - cron: "0 2 * * *" # daily, 02:00 UTC
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      DUMP_URL: ${{ secrets.DIRECT_URL != '' && secrets.DIRECT_URL || secrets.DATABASE_URL }}
    steps:
      - name: Dump database (skips cleanly if no secret is set)
        run: |
          if [ -z "${DUMP_URL}" ]; then
            echo "No DIRECT_URL/DATABASE_URL secret set — backups are inactive."
            echo "Owner: add DIRECT_URL (preferred) or DATABASE_URL in Settings → Secrets and variables → Actions to activate."
            exit 0
          fi
          STAMP="$(date +%Y-%m-%d-%H%M%S)"
          docker run --rm -i postgres:17 pg_dump "${DUMP_URL}" --no-owner --no-privileges > "pakam-${STAMP}.sql"
          echo "STAMP=${STAMP}" >> "$GITHUB_ENV"
          echo "Backup size: $(du -h "pakam-${STAMP}.sql" | cut -f1)"

      - name: Upload backup artifact
        if: ${{ env.STAMP != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ env.STAMP }}
          path: "pakam-*.sql"
          retention-days: 30
          if-no-files-found: ignore
